<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="980" height="440" fill="white"/>
  <!-- legend -->
  <rect x="60" y="10" width="14" height="14" fill="#2b6cb0"/>
  <text x="78" y="21" font-size="11" fill="#1a1a1a">Quick tier — organic volatile memristor (hippocampal)</text>
  <rect x="430" y="10" width="14" height="14" fill="#6b46c1"/>
  <text x="448" y="21" font-size="11" fill="#1a1a1a">Replay — bridges both tiers</text>
  <rect x="650" y="10" width="14" height="14" fill="#c05621"/>
  <text x="668" y="21" font-size="11" fill="#1a1a1a">Slow tier — inorganic non-volatile memristor (cortical)</text>

  <!-- vertical gridlines at each tick -->
  <g stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="91" y1="45" x2="91" y2="400"/>
    <line x1="163" y1="45" x2="163" y2="400"/>
    <line x1="235" y1="45" x2="235" y2="400"/>
    <line x1="307" y1="45" x2="307" y2="400"/>
    <line x1="434" y1="45" x2="434" y2="400"/>
    <line x1="562" y1="45" x2="562" y2="400"/>
    <line x1="661" y1="45" x2="661" y2="400"/>
    <line x1="721" y1="45" x2="721" y2="400"/>
    <line x1="766" y1="45" x2="766" y2="400"/>
    <line x1="844" y1="45" x2="844" y2="400"/>
    <line x1="916" y1="45" x2="916" y2="400"/>
  </g>

  <!-- stage bars -->
  <g>
    <title>Neurotransmission (AMPA/NMDA gating), ~0.5–5 ms — §3.1</title>
    <rect x="70" y="60" width="72" height="24" rx="4" fill="#2b6cb0"/>
    <text x="150" y="76" font-size="12" fill="#1a1a1a">Neurotransmission (AMPA/NMDA gating) — 0.5–5 ms</text>
  </g>

  <g>
    <title>Short-term plasticity, ~10 ms–1 s — §4.2</title>
    <rect x="163" y="102" width="144" height="24" rx="4" fill="#2b6cb0"/>
    <text x="315" y="118" font-size="12" fill="#1a1a1a">Short-term plasticity — 10 ms–1 s</text>
  </g>

  <g>
    <title>Ca²⁺/kinase cascades, ~1 s–5 min — §4.2</title>
    <rect x="307" y="144" width="177" height="24" rx="4" fill="#2b6cb0"/>
    <text x="492" y="160" font-size="12" fill="#1a1a1a">Ca²⁺/kinase cascades — 1 s–5 min</text>
  </g>

  <g>
    <title>AMPAR trafficking / early-LTP, ~1–30 min, decays over 1–3 hr — §2</title>
    <rect x="434" y="186" width="162" height="24" rx="4" fill="#2b6cb0"/>
    <text x="604" y="202" font-size="12" fill="#1a1a1a">AMPAR trafficking / early-LTP — 1–30 min, decays 1–3 hr</text>
  </g>

  <g>
    <title>Synaptic tagging &amp; capture — tag set 1–2 min, decays τ≈1–4 hr — §2</title>
    <rect x="434" y="228" width="171" height="24" rx="4" fill="#2b6cb0"/>
    <text x="613" y="244" font-size="12" fill="#1a1a1a">Synaptic tagging &amp; capture — tag 1–2 min, decay τ≈1–4 hr</text>
  </g>

  <g>
    <title>Transcription / late-LTP, onset ~30–60 min, stable ~2 days — §4.5</title>
    <rect x="540" y="270" width="142" height="24" rx="4" fill="#2b6cb0"/>
    <text x="690" y="286" font-size="12" fill="#1a1a1a">Transcription / late-LTP — onset 30–60 min, stable ~2 days</text>
  </g>

  <g>
    <title>Sharp-wave-ripple replay, ripple 100–300 ms, recurs over hours–days — §4.5</title>
    <rect x="235" y="312" width="497" height="24" rx="4" fill="#6b46c1"/>
    <text x="742" y="328" font-size="12" fill="#1a1a1a">SWR replay — 100–300 ms, recurs hours–days</text>
  </g>

  <g>
    <title>Systems consolidation, days–weeks (rodent) to months–years (human) — §4.5</title>
    <rect x="661" y="354" width="255" height="24" rx="4" fill="#c05621"/>
    <text x="925" y="370" font-size="12" fill="#1a1a1a" text-anchor="end">Systems consolidation — days–years</text>
  </g>

  <!-- axis -->
  <line x1="60" y1="400" x2="930" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <g font-size="10" fill="#1a1a1a">
    <text x="91" y="415" text-anchor="end" transform="rotate(-40 91 415)">1 ms</text>
    <text x="163" y="415" text-anchor="end" transform="rotate(-40 163 415)">10 ms</text>
    <text x="235" y="415" text-anchor="end" transform="rotate(-40 235 415)">100 ms</text>
    <text x="307" y="415" text-anchor="end" transform="rotate(-40 307 415)">1 s</text>
    <text x="434" y="415" text-anchor="end" transform="rotate(-40 434 415)">1 min</text>
    <text x="562" y="415" text-anchor="end" transform="rotate(-40 562 415)">1 hr</text>
    <text x="661" y="415" text-anchor="end" transform="rotate(-40 661 415)">1 day</text>
    <text x="721" y="415" text-anchor="end" transform="rotate(-40 721 415)">1 week</text>
    <text x="766" y="415" text-anchor="end" transform="rotate(-40 766 415)">1 month</text>
    <text x="844" y="415" text-anchor="end" transform="rotate(-40 844 415)">1 year</text>
    <text x="916" y="415" text-anchor="end" transform="rotate(-40 916 415)">10 yr</text>
  </g>
  <text x="495" y="435" text-anchor="middle" font-size="11" fill="#1a1a1a">Time (log scale)</text>
</svg>
