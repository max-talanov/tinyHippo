<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1336" viewBox="0 0 680 668" font-family="Helvetica, Arial, sans-serif">
<title>tinyHippo architecture at 12% scale: neurons per population, synapses per projection</title>
<style>
.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#444}
.e rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.8}.e .th{fill:#633806}.e .ts{fill:#854F0B}
.i rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:.8}.i .th{fill:#0C447C}.i .ts{fill:#185FA5}
.ae{fill:none;stroke:#BA7517;stroke-width:1.5}.ai{fill:none;stroke:#378ADD;stroke-width:1.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="668" fill="#fff"/>
<g transform="translate(0,22)" text-anchor="start">
<rect x="350" y="34" width="285" height="206" rx="12" fill="none" stroke="#999" stroke-width=".7" stroke-dasharray="4 3"/>
<text class="ts" x="362" y="50">CA3</text>

<g class="e"><rect x="40" y="64" width="100" height="62" rx="8"/><text class="th" x="90" y="92" text-anchor="middle">EC LII</text><text class="ts" x="90" y="110" text-anchor="middle">12,005</text></g>
<g class="e"><rect x="180" y="64" width="120" height="62" rx="8"/><text class="th" x="240" y="92" text-anchor="middle">Granule cells</text><text class="ts" x="240" y="110" text-anchor="middle">143,990</text></g>
<g class="i"><rect x="180" y="170" width="120" height="62" rx="8"/><text class="th" x="240" y="198" text-anchor="middle">DG basket</text><text class="ts" x="240" y="216" text-anchor="middle">1,190</text></g>
<g class="e"><rect x="40" y="170" width="100" height="62" rx="8"/><text class="th" x="90" y="198" text-anchor="middle">Mossy cells</text><text class="ts" x="90" y="216" text-anchor="middle">3,570</text></g>
<g class="e"><rect x="362" y="64" width="110" height="62" rx="8"/><text class="th" x="417" y="84" text-anchor="middle">CA3 SUP</text><text class="ts" x="417" y="101" text-anchor="middle">31,675</text><text class="ts" x="417" y="117" text-anchor="middle">rec 1.27M</text></g>
<g class="e"><rect x="518" y="64" width="104" height="62" rx="8"/><text class="th" x="570" y="84" text-anchor="middle">CA3 DEEP</text><text class="ts" x="570" y="101" text-anchor="middle">7,910</text><text class="ts" x="570" y="117" text-anchor="middle">rec 103k</text></g>
<g class="i"><rect x="362" y="170" width="110" height="52" rx="8"/><text class="th" x="417" y="192" text-anchor="middle">INT SUP</text><text class="ts" x="417" y="210" text-anchor="middle">2,870</text></g>
<g class="i"><rect x="518" y="170" width="104" height="52" rx="8"/><text class="th" x="570" y="192" text-anchor="middle">INT DEEP</text><text class="ts" x="570" y="210" text-anchor="middle">945</text></g>
<g class="e"><rect x="340" y="290" width="150" height="62" rx="8"/><text class="th" x="415" y="310" text-anchor="middle">CA1 pyramidal</text><text class="ts" x="415" y="327" text-anchor="middle">55,195</text><text class="ts" x="415" y="343" text-anchor="middle">rec 276k</text></g>
<g class="i"><rect x="565" y="290" width="92" height="62" rx="8"/><text class="th" x="611" y="316" text-anchor="middle">CA1 basket</text><text class="ts" x="611" y="336" text-anchor="middle">1,680</text></g>
<g class="i"><rect x="565" y="380" width="92" height="62" rx="8"/><text class="th" x="611" y="406" text-anchor="middle">CA1 OLM</text><text class="ts" x="611" y="426" text-anchor="middle">1,085</text></g>
<g class="e"><rect x="340" y="430" width="150" height="62" rx="8"/><text class="th" x="415" y="458" text-anchor="middle">EC LV</text><text class="ts" x="415" y="476" text-anchor="middle">7,203</text></g>
<g class="e"><rect x="340" y="540" width="150" height="62" rx="8"/><text class="th" x="415" y="560" text-anchor="middle">mPFC</text><text class="ts" x="415" y="577" text-anchor="middle">1,440</text><text class="ts" x="415" y="593" text-anchor="middle">rec 28.8k</text></g>
<g class="i"><rect x="565" y="540" width="92" height="62" rx="8"/><text class="th" x="611" y="566" text-anchor="middle">mPFC INT</text><text class="ts" x="611" y="586" text-anchor="middle">288</text></g>

<line x1="142" y1="95" x2="178" y2="95" class="ae" marker-end="url(#arrow)"/><text class="ts" x="160" y="88" text-anchor="middle">7.2M</text>
<line x1="302" y1="95" x2="360" y2="95" class="ae" marker-end="url(#arrow)"/><text class="ts" x="331" y="88" text-anchor="middle">475k</text>
<path d="M240 62 V12 H570 V62" class="ae" marker-end="url(#arrow)"/><text class="ts" x="250" y="8">mossy fibre to CA3 DEEP 63k</text>
<line x1="214" y1="128" x2="214" y2="168" class="ae" marker-end="url(#arrow)"/><text class="ts" x="208" y="152" text-anchor="end">60k</text>
<line x1="266" y1="168" x2="266" y2="128" class="ai" marker-end="url(#arrow)"/><text class="ts" x="272" y="152">20.2M</text>
<line x1="164" y1="128" x2="130" y2="168" class="ae" marker-end="url(#arrow)"/>
<line x1="108" y1="168" x2="178" y2="122" class="ae" marker-end="url(#arrow)"/>
<line x1="142" y1="201" x2="178" y2="201" class="ae" marker-end="url(#arrow)"/><text class="ts" x="160" y="194" text-anchor="middle">24k</text>
<text class="ts" x="40" y="148">GC→MC 107k</text><text class="ts" x="40" y="164">MC→GC 1.15M</text>
<line x1="474" y1="88" x2="516" y2="88" class="ae" marker-end="url(#arrow)"/><text class="ts" x="495" y="81" text-anchor="middle">158k</text>
<line x1="516" y1="108" x2="474" y2="108" class="ae" marker-end="url(#arrow)"/><text class="ts" x="495" y="123" text-anchor="middle">32k</text>
<line x1="380" y1="128" x2="380" y2="168" class="ae" marker-end="url(#arrow)"/><text class="ts" x="386" y="152">144k</text>
<line x1="446" y1="168" x2="446" y2="128" class="ai" marker-end="url(#arrow)"/><text class="ts" x="452" y="152">4.75M</text>
<line x1="536" y1="128" x2="536" y2="168" class="ae" marker-end="url(#arrow)"/><text class="ts" x="542" y="152">19k</text>
<line x1="598" y1="168" x2="598" y2="128" class="ai" marker-end="url(#arrow)"/><text class="ts" x="604" y="152">633k</text>
<line x1="430" y1="242" x2="430" y2="288" class="ae" stroke-width="3" style="stroke-width:3" marker-end="url(#arrow)"/><text class="ts" x="440" y="268">Schaffer 220.8M</text>
<line x1="611" y1="242" x2="611" y2="288" class="ae" marker-end="url(#arrow)"/><text class="ts" x="619" y="268">1.18M</text>
<line x1="492" y1="308" x2="563" y2="308" class="ae" marker-end="url(#arrow)"/><text class="ts" x="527" y="301" text-anchor="middle">17k</text>
<line x1="563" y1="334" x2="492" y2="334" class="ai" marker-end="url(#arrow)"/><text class="ts" x="527" y="349" text-anchor="middle">2.76M</text>
<path d="M563 411 H470 V354" class="ai" marker-end="url(#arrow)"/><text class="ts" x="500" y="404">1.10M</text>
<line x1="380" y1="354" x2="380" y2="428" class="ae" marker-end="url(#arrow)"/><text class="ts" x="388" y="395">216k</text>
<path d="M338 321 H10 V84 H38" class="ae" marker-end="url(#arrow)"/><text class="ts" x="36" y="314">CA1→EC LII 600k</text>
<path d="M40 104 H26 V461 H338" class="ae" marker-end="url(#arrow)"/><text class="ts" x="36" y="454">EC LII→EC LV 144k</text>
<path d="M492 461 H668 V26 H417 V62" class="ae" marker-end="url(#arrow)"/><text class="ts" x="430" y="20">EC LV→CA3 SUP 158k</text>
<line x1="415" y1="494" x2="415" y2="538" class="ae" marker-end="url(#arrow)"/><text class="ts" x="423" y="520">28.8k</text>
<line x1="492" y1="566" x2="563" y2="566" class="ae" marker-end="url(#arrow)"/><text class="ts" x="527" y="559" text-anchor="middle">14k</text>
<line x1="563" y1="584" x2="492" y2="584" class="ai" marker-end="url(#arrow)"/><text class="ts" x="527" y="599" text-anchor="middle">17k</text>

<text class="ts" x="40" y="490">12% scale (35 CA3 groups), ≈264M synapses,</text>
<text class="ts" x="40" y="506">84% Schaffer (SUP 165.6M + DEEP 55.2M).</text>
<text class="ts" x="40" y="522">Not drawn: INT SUP→DEEP 79k, INT DEEP→SUP</text>
<text class="ts" x="40" y="538">317k, INT→INT 86k (SUP) and 28k (DEEP).</text>
<rect x="40" y="568" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width=".8"/><text class="ts" x="62" y="579">Excitatory</text>
<rect x="40" y="590" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width=".8"/><text class="ts" x="62" y="601">Inhibitory</text>
</g></svg>
